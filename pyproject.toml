[tool.poetry]
name = "gptauthor"
version = "1.1.0"
description = "GPTAuthor is a tool for writing long form stories using AI"
authors = ["Dylan Hogg <dylanhogg@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/dylanhogg/gptauthor"
keywords = ["GPTAuthor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Games/Entertainment",
]
include = ["prompts-openai-drama.yaml", "prompts-echoes-of-atlantis.yaml"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = ">=3.12,<3.14.1 || >3.14.1,<4.0"
openai = "^2.38.0"
httpx = "^0.25.0"
networkx = "^3.6.1"
beautifulsoup4 = "^4.14.3"
pyvis = "^0.3.2"
joblib = "^1.5.3"
tenacity = "^9.1.4"
omegaconf = "^2.3.0"
matplotlib = "^3.10.9"
python-dotenv = "^1.2.2"
click = "^8.4.1"
typer = "^0.25.1"
rich = "^15.0.0"
tqdm = "^4.67.3"
loguru = "^0.7.2"
markdown = "^3.10.2"

[tool.poetry.group.dev.dependencies]
pytest = "^9.0.3"
black = "^26.5.1"
ruff = "^0.1.15"
coverage = "^7.14.0"
pre-commit = "^4.6.0"
pip-audit = "^2.10.0"

[tool.black]
line-length = 120
target-version = ['py39']

[tool.poetry.scripts]
gptauthor = 'gptauthor.console:typer_app'

[tool.ruff]
# https://docs.astral.sh/ruff/rules/
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C",   # flake8-comprehensions
    "B",   # flake8-bugbear
    "C90", # mccabe complexity
]
ignore = [
    "E501", # line too long, handled by black
    "D203", # 1 blank line required before class docstring
]
line-length = 120
extend-exclude = [".joblib_cache"]
fixable = ["ALL"]
unfixable = []
target-version = "py39"
